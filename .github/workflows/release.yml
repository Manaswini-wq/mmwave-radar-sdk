name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake

      - name: Build all platforms
        run: |
          for plat in awr2944 iwr6843; do
            cmake -B build-${plat} -DPLATFORM=${plat} -DCMAKE_BUILD_TYPE=Release
            cmake --build build-${plat} --parallel $(nproc)
          done

      - name: Package SDK archive
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist
          tar czf dist/mmwave-radar-sdk-${VERSION}.tar.gz \
            --exclude='.git' --exclude='build-*' --exclude='dist' .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mmwave-radar-sdk-*.tar.gz
          generate_release_notes: true
